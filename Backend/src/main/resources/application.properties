spring.application.name=clon-x-backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=xclone;encrypt=true;trustServerCertificate=true;integratedSecurity=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:dev-only-change-this-secret-key-at-least-32-characters}
