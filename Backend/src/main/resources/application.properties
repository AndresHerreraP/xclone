spring.application.name=xclone-backend
server.port=8080

# Loads variables from a local .env file (optional). Never commit the real .env
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=xclone;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

# Hibernate only validates the schema: the tables are owned by the versioned Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: creates the schema on an empty database and baselines databases that already
# have tables (e.g. a database previously created by Hibernate) so V1 is not reapplied.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.seed.enabled=${SEED_ENABLED:true}
